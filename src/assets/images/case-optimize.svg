<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round">
  <!-- Gauge / speedometer -->
  <circle cx="400" cy="320" r="140" opacity="0.06" fill="#0f172a" stroke="none"/>
  <path d="M280 390 A140 140 0 0 1 520 390" opacity="0.3"/>
  <!-- Tick marks -->
  <line x1="290" y1="340" x2="310" y2="350" opacity="0.2"/>
  <line x1="310" y1="270" x2="325" y2="285" opacity="0.2"/>
  <line x1="400" y1="240" x2="400" y2="260" opacity="0.2"/>
  <line x1="490" y1="270" x2="475" y2="285" opacity="0.2"/>
  <line x1="510" y1="340" x2="490" y2="350" opacity="0.2"/>
  <!-- Needle pointing to fast -->
  <line x1="400" y1="320" x2="480" y2="275" stroke-width="2.5" opacity="0.5"/>
  <circle cx="400" cy="320" r="8" fill="#0f172a" opacity="0.4" stroke="none"/>
  <!-- Code brackets -->
  <text x="340" y="430" font-family="monospace" font-size="20" fill="#0f172a" opacity="0.2" stroke="none">&lt;/&gt;</text>
</svg>
