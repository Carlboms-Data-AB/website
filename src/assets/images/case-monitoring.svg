<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round">
  <!-- Screen -->
  <rect x="180" y="140" width="440" height="280" rx="8" opacity="0.06" fill="#0f172a" stroke="none"/>
  <rect x="180" y="140" width="440" height="280" rx="8" opacity="0.4"/>
