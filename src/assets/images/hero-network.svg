<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round">
  <!-- Central node -->
  <circle cx="400" cy="300" r="24" fill="#0f172a" opacity="0.08"/>
  <circle cx="400" cy="300" r="6" fill="#0f172a"/>
  <!-- Outer nodes -->
  <circle cx="200" cy="160" r="16" fill="#0f172a" opacity="0.05"/>
  <circle cx="200" cy="160" r="4" fill="#0f172a"/>
  <circle cx="600" cy="160" r="16" fill="#0f172a" opacity="0.05"/>
  <circle cx="600" cy="160" r="4" fill="#0f172a"/>
  <circle cx="160" cy="380" r="16" fill="#0f172a" opacity="0.05"/>
  <circle cx="160" cy="380" r="4" fill="#0f172a"/>
  <circle cx="640" cy="380" r="16" fill="#0f172a" opacity="0.05"/>
  <circle cx="640" cy="380" r="4" fill="#0f172a"/>
  <circle cx="300" cy="480" r="16" fill="#0f172a" opacity="0.05"/>
  <circle cx="300" cy="480" r="4" fill="#0f172a"/>
  <circle cx="500" cy="480" r="16" fill="#0f172a" opacity="0.05"/>
  <circle cx="500" cy="480" r="4" fill="#0f172a"/>
  <!-- Connections -->
  <line x1="400" y1="300" x2="200" y2="160" opacity="0.3"/>
  <line x1="400" y1="300" x2="600" y2="160" opacity="0.3"/>
  <line x1="400" y1="300" x2="160" y2="380" opacity="0.3"/>
  <line x1="400" y1="300" x2="640" y2="380" opacity="0.3"/>
  <line x1="400" y1="300" x2="300" y2="480" opacity="0.3"/>
  <line x1="400" y1="300" x2="500" y2="480" opacity="0.3"/>
  <!-- Cross connections -->
  <line x1="200" y1="160" x2="160" y2="380" opacity="0.12"/>
  <line x1="600" y1="160" x2="640" y2="380" opacity="0.12"/>
  <line x1="160" y1="380" x2="300" y2="480" opacity="0.12"/>
  <line x1="640" y1="380" x2="500" y2="480" opacity="0.12"/>
  <line x1="200" y1="160" x2="600" y2="160" opacity="0.12"/>
  <line x1="300" y1="480" x2="500" y2="480" opacity="0.12"/>
</svg>
